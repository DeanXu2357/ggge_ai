[project]
name = "ggge-ai"
version = "0.1.0"
description = "Automated stage clearing for SD Gundam G Generation mobile game using GOAP"
requires-python = ">=3.12"
dependencies = [
    "uiautomator2>=3.7.0",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ggge_ai", "src/ggge_ai_2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pyright]
include = ["src/ggge_ai_2", "tests/ggge_ai_2"]
strict = ["src/ggge_ai_2"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
