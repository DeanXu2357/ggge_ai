<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky ruling bar on top, a dense grid of frame crops below, a full-frame dialog for close looks. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --fg: #1d2421; --muted: #5f6b66; --line: #d5dad6;
  --accent: #0f6f78; --yes: #1f7a3a; --yes-bg: #e2f2e6; --no: #a3352b; --no-bg: #f7e3e0;
  --unclear: #8a6410; --unclear-bg: #f6edd5; --mid: #3d5a80; --mid-bg: #e1e8f2; --box: #ffd400;
  --ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --surface: #1d2422; --fg: #e4ebe7; --muted: #95a39d; --line: #33403b;
  --accent: #5cc2cb; --yes: #7fd394; --yes-bg: #1d3a26; --no: #f0938a; --no-bg: #43231f;
  --unclear: #e6c36a; --unclear-bg: #3d321a; --mid: #9fb8dc; --mid-bg: #23304a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1d2422; --fg: #e4ebe7; --muted: #95a39d; --line: #33403b;
  --accent: #5cc2cb; --yes: #7fd394; --yes-bg: #1d3a26; --no: #f0938a; --no-bg: #43231f;
  --unclear: #e6c36a; --unclear-bg: #3d321a; --mid: #9fb8dc; --mid-bg: #23304a; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.intro { padding-block: 20px 8px; display: grid; gap: 6px; max-width: 72ch; }
h1 { margin: 0; font-size: 1.45rem; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); line-height: 1.6; }
.intro b { color: var(--fg); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; font-variant-numeric: tabular-nums; }
.chip { padding: 3px 9px; border-radius: 999px; font-size: 0.82rem; border: 1px solid var(--line); }
.chip.yes { color: var(--yes); background: var(--yes-bg); border-color: transparent; }
.chip.no { color: var(--no); background: var(--no-bg); border-color: transparent; }
.chip.unclear { color: var(--unclear); background: var(--unclear-bg); border-color: transparent; }
.chip.mid { color: var(--mid); background: var(--mid-bg); border-color: transparent; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select { font: inherit; font-size: 0.88rem; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); max-width: 100%; }
.status { font-size: 0.82rem; color: var(--muted); }
.status.err { color: var(--no); }
main.grid { padding-block: 16px 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 6px; min-width: 0; }
.card:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card[data-tone="yes"] { border-color: var(--yes); }
.card[data-tone="no"] { border-color: var(--no); }
.card[data-tone="unclear"] { border-color: var(--unclear); }
.card[data-tone="mid"] { border-color: var(--mid); }
.card img { width: 100%; display: block; border-radius: 4px; cursor: zoom-in; background: #000; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 0.78rem; color: var(--muted); min-width: 0; }
.meta .id { font-family: var(--mono); color: var(--fg); font-weight: 600; }
.meta .screen { font-family: var(--mono); overflow-wrap: anywhere; }
.tag { font-size: 0.72rem; letter-spacing: 0.03em; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 4px; }
.seg button { font: inherit; font-size: 0.88rem; padding: 6px 4px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"].yes { background: var(--yes-bg); color: var(--yes); border-color: var(--yes); font-weight: 700; }
.seg button[aria-pressed="true"].no { background: var(--no-bg); color: var(--no); border-color: var(--no); font-weight: 700; }
.seg button[aria-pressed="true"].unclear { background: var(--unclear-bg); color: var(--unclear); border-color: var(--unclear); font-weight: 700; }
.seg button[aria-pressed="true"].mid { background: var(--mid-bg); color: var(--mid); border-color: var(--mid); font-weight: 700; }
.seg button:disabled { opacity: 0.5; cursor: default; }
.empty { color: var(--muted); padding-block: 24px; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 12px; width: min(1200px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgb(0 0 0 / 0.6); }
dialog img { width: 100%; display: block; border-radius: 4px; }
.dlg-head { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.dlg-nav { display: flex; gap: 6px; }
.dlg-nav button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
dialog .seg { margin-top: 8px; max-width: 420px; }
kbd { font-family: var(--mono); font-size: 0.8em; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color 120ms; } }
</style>

<header class="intro wrap">
  <h1>__TITLE__</h1>
  <p>每張小圖是幀的一角，<b>黃框</b>是元件的量測區。__QUESTION__被特效或轉場蓋住而看不出來時，選<b>判不了</b>。再按一次已選的按鈕會清掉判例。</p>
  <p>點小圖看整張幀。鍵盤：先點卡片，按數字鍵 <kbd>1</kbd>、<kbd>2</kbd>… 選第幾個按鈕，焦點會自動跳到下一張。按住 Shift 點按鈕，會把上一次點的卡片到這張之間「還沒判」的卡片都設成同一個值。卡片順序依偵測分數由高到低，但頁面不顯示分數。</p>
</header>

<div class="bar wrap" role="toolbar" aria-label="篩選與進度">
  <div class="counts" id="counts"></div>
  <div class="filters">
    <select id="filter-state" aria-label="判例篩選">
      <option value="all">全部幀</option>
      <option value="todo">還沒判</option>
    </select>
    <select id="filter-screen" aria-label="畫面篩選"></select>
  </div>
  <span class="status" id="status">連線中…</span>
</div>

<main class="grid wrap" id="grid" aria-live="polite"></main>

<dialog id="dlg" aria-label="整張幀">
  <div class="dlg-head">
    <div class="meta" id="dlg-meta"></div>
    <div class="dlg-nav">
      <button type="button" id="dlg-prev">← 上一張</button>
      <button type="button" id="dlg-next">下一張 →</button>
      <button type="button" id="dlg-close">關閉</button>
    </div>
  </div>
  <img id="dlg-img" alt="">
  <div class="seg" id="dlg-seg"></div>
</dialog>

<script>
const CASES = /*CASES*/[];
const CONFIG = /*CONFIG*/{};
const COLLECTION = CONFIG.collection;
const VALUES = CONFIG.values;
const TONE = Object.fromEntries(VALUES.map(([value, , tone]) => [value, tone]));
const keyIndex = (key) => { const i = Number(key) - 1; return Number.isInteger(i) && i >= 0 && i < VALUES.length ? i : -1; };
const labels = new Map();
let db = null;
let anchor = null;
let dialogId = null;

const $ = (id) => document.getElementById(id);
const byId = new Map(CASES.map((c) => [c.id, c]));

function status(text, err) { const s = $("status"); s.textContent = text; s.classList.toggle("err", !!err); }

function visible() {
  const st = $("filter-state").value, sc = $("filter-screen").value;
  return CASES.filter((c) => {
    const v = labels.get(c.id);
    if (sc !== "all" && c.screen !== sc) return false;
    if (st === "all") return true;
    if (st === "todo") return !v;
    return v === st;
  });
}

function segButtons(container, id) {
  container.replaceChildren();
  container.style.setProperty("--n", VALUES.length);
  for (const [value, text] of VALUES) {
    const b = document.createElement("button");
    b.type = "button"; b.className = TONE[value]; b.textContent = text; b.dataset.value = value;
    b.setAttribute("aria-pressed", String(labels.get(id) === value));
    b.disabled = !db;
    b.addEventListener("click", (e) => choose(id, value, e.shiftKey));
    container.append(b);
  }
}

function metaInto(el, c) {
  el.replaceChildren();
  const add = (text, cls) => { const s = document.createElement("span"); s.textContent = text; if (cls) s.className = cls; el.append(s); };
  add(c.id, "id"); add(c.screen, "screen");
  if (c.auto && c.auto !== "manual") add("AUTO " + c.auto, "tag");
  if (c.power_save) add("省電 " + c.power_save, "tag");
  if (c.transition) add("轉場", "tag");
}

function card(c) {
  const el = document.createElement("article");
  el.className = "card"; el.tabIndex = 0; el.dataset.id = c.id;
  const v = labels.get(c.id); if (v) el.dataset.tone = TONE[v];
  const img = document.createElement("img");
  img.src = "data:image/jpeg;base64," + c.crop; img.alt = c.id + " 左上角"; img.loading = "lazy";
  img.addEventListener("click", () => openDialog(c.id));
  const meta = document.createElement("div"); meta.className = "meta"; metaInto(meta, c);
  const seg = document.createElement("div"); seg.className = "seg"; segButtons(seg, c.id);
  el.append(img, meta, seg);
  el.addEventListener("keydown", (e) => {
    const i = keyIndex(e.key);
    if (i < 0 || !db) return;
    e.preventDefault();
    choose(c.id, VALUES[i][0], false);
    const next = el.nextElementSibling; if (next) next.focus();
  });
  return el;
}

function renderCounts() {
  const n = Object.fromEntries(VALUES.map(([value]) => [value, 0]));
  for (const v of labels.values()) if (v in n) n[v]++;
  const done = Object.values(n).reduce((a, b) => a + b, 0);
  const box = $("counts"); box.replaceChildren();
  const chip = (text, cls) => { const s = document.createElement("span"); s.className = "chip " + (cls || ""); s.textContent = text; box.append(s); };
  chip(`已判 ${done} / ${CASES.length}`);
  for (const [value, text, tone] of VALUES) chip(`${text} ${n[value]}`, tone);
}

function render() {
  const list = visible();
  const grid = $("grid");
  if (!list.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "這個篩選下沒有幀。"; grid.replaceChildren(p); }
  else grid.replaceChildren(...list.map(card));
  renderCounts();
  if (dialogId) fillDialog();
}

function refreshCard(id) {
  const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (el) {
    const v = labels.get(id);
    if (v) el.dataset.tone = TONE[v]; else delete el.dataset.tone;
    segButtons(el.querySelector(".seg"), id);
  }
  renderCounts();
  if (dialogId === id) fillDialog();
}

async function write(id, value) {
  const ref = db.collection(COLLECTION).doc(id);
  if (value) await ref.set({ value, at: new Date().toISOString() });
  else await ref.delete();
}

async function choose(id, value, range) {
  if (!db) return;
  const targets = [];
  if (range && anchor && anchor !== id) {
    const order = visible().map((c) => c.id);
    const a = order.indexOf(anchor), b = order.indexOf(id);
    if (a >= 0 && b >= 0) for (const x of order.slice(Math.min(a, b), Math.max(a, b) + 1)) if (x === id || !labels.get(x)) targets.push([x, value]);
  }
  if (!targets.length) targets.push([id, labels.get(id) === value ? null : value]);
  anchor = id;
  for (const [x, v] of targets) { if (v) labels.set(x, v); else labels.delete(x); refreshCard(x); }
  status(`儲存 ${targets.length} 筆…`);
  try {
    for (const [x, v] of targets) await write(x, v);
    status("已儲存");
  } catch (e) {
    status(`儲存失敗（${e && e.code ? e.code : "未知錯誤"}），重新整理頁面後再試`, true);
  }
}

function openDialog(id) { dialogId = id; fillDialog(); const d = $("dlg"); if (!d.open) d.showModal(); }
function fillDialog() {
  const c = byId.get(dialogId);
  metaInto($("dlg-meta"), c);
  $("dlg-img").src = "full/" + encodeURIComponent(c.id) + ".jpg"; $("dlg-img").alt = c.id + " 整張幀";
  segButtons($("dlg-seg"), c.id);
}
function step(delta) {
  const order = visible().map((c) => c.id);
  const i = order.indexOf(dialogId);
  const next = order[i + delta];
  if (next) { dialogId = next; fillDialog(); }
}
$("dlg-prev").addEventListener("click", () => step(-1));
$("dlg-next").addEventListener("click", () => step(1));
$("dlg-close").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("close", () => { dialogId = null; });
$("dlg").addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else { const i = keyIndex(e.key); if (i >= 0 && db) { choose(dialogId, VALUES[i][0], false); step(1); } }
});

(function screens() {
  const counts = new Map();
  for (const c of CASES) counts.set(c.screen, (counts.get(c.screen) || 0) + 1);
  const sel = $("filter-screen");
  const all = document.createElement("option"); all.value = "all"; all.textContent = "所有畫面"; sel.append(all);
  for (const [s, n] of [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))) {
    const o = document.createElement("option"); o.value = s; o.textContent = `${s}（${n}）`; sel.append(o);
  }
})();
for (const [value, text] of VALUES) { const o = document.createElement("option"); o.value = value; o.textContent = text; $("filter-state").append(o); }
$("filter-state").addEventListener("change", render);
$("filter-screen").addEventListener("change", render);
render();

(async () => {
  const store = await window.claude?.use?.("db");
  if (!store) { status("無法連到判例資料庫：請登入 claude.ai 後開啟這一頁", true); return; }
  db = store;
  const timer = setTimeout(() => status("資料庫還沒回應，判例可能不是最新", true), 10000);
  let first = true;
  db.collection(COLLECTION).onSnapshot((snap) => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    const before = new Map(labels);
    labels.clear();
    for (const d of snap.docs) { const v = d.data()?.value; if (v) labels.set(d.id, v); }
    if (first) { render(); first = false; }
    else for (const id of new Set([...before.keys(), ...labels.keys()])) if (before.get(id) !== labels.get(id)) refreshCard(id);
    if (!snap.metadata.fromCache && !snap.metadata.hasPendingWrites) status("已同步");
  }, (e) => { clearTimeout(timer); status(`資料庫中斷（${e.code}），重新整理頁面`, true); });
})();
</script>
